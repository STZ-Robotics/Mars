# MARS simulation protocol manifest.
#
# The single source of truth for topic names. The engine (C++) and the bridge
# (Rust) generate their constants from here; nobody writes a topic name by
# hand in the code. If a topic is not in this file, it does not exist.
#
# Directions, from the BRIDGE's point of view:
#   out  the bridge publishes
#   in   the bridge subscribes
protocol_version = "0.1.0"
world = "mars"

# Field dimensions, in meters. They live here because BOTH sides need them:
# the world uses them for the ground plane and the bridge to translate from
# Gazebo's frame (origin at the center) to WPILib's (origin at the blue
# corner). If they diverge, the poses come out shifted and there is no error
# anywhere; check.py verifies that every world's <plane><size> matches.
[field]
length_m = 16.54
width_m = 8.21

# ---------------------------------------------------------------------------
# Hop 1: engine <-> bridge, over gz-transport (protobuf)
# ---------------------------------------------------------------------------
# Only standard `gz.msgs` types are used, never .proto files of our own. Two
# reasons: a custom .proto forces gz-msgs_protoc_plugin into the build, and
# gz-msgs12's dynamic descriptor comes broken on conda-forge (see README), so
# any type of ours would be invisible to the tools.

[[gz]]
topic = "/mars/meta/hello"
type = "gz.msgs.StringMsg"
dir = "in"
source = "custom"
rate_hz = 1
desc = """The engine announces its protocol_version on startup. The bridge \
refuses to operate if the major does not match its own. A cheap handshake that \
avoids debugging a contract mismatch for an hour."""

[[gz]]
topic = "/mars/cmd/actuators"
type = "gz.msgs.Actuators"
dir = "out"
source = "custom"
rate_hz = 200
desc = """In LOCKSTEP the bridge sets header.data["seq"] (increasing) and MarsLink
stops running free: each step waits for the command with the next seq, and
/mars/state/joints and /mars/state/pose go out with the same seq in their
header. See bridge/src/lockstep.rs.

Motor commands, indexed by the robot-map's actuator order. The three fields
share indexing and each actuator reads the one its control mode calls for,
declared in the SDF's <actuator>:

  control="duty"      reads `normalized` (-1..1), applied as is
  control="position"  reads `position` (JOINT radians) as the setpoint, and the
                      engine closes a PD at the physics rate

Position mode exists because it is the only way to simulate a CAN motor
faithfully: a TalonFX closes its loop INSIDE the controller at ~1 kHz and the
robot code only sends it the setpoint. A swerve forces it --- a 12.8:1 steer
with a Kraken has 90 N*m over 0.008 kg*m2, and no loop over the network has
authority over that, neither at 50 Hz nor at 250.

`velocity` stays reserved, for when velocity control is needed."""

[[gz]]
topic = "/mars/cmd/match"
type = "gz.msgs.Int32"
dir = "out"
source = "custom"
rate_hz = 50
desc = """Match state: 0=disabled 1=autonomous 2=teleop 3=test 4=estop. \
The engine needs it to brake the actuators when the robot is disabled \
instead of leaving them at the last value received."""

[[gz]]
topic = "/mars/state/joints"
type = "gz.msgs.Model"
dir = "in"
source = "custom"
rate_hz = 250
desc = """Position and velocity of every joint. The encoders are derived from \
here: the bridge multiplies by countsPerRevolution and the robot-map's gear \
ratio. It runs at 200 Hz because a robot cycle is 20 ms and we want it to \
never read a stale value."""

[[gz]]
topic = "/mars/state/pose"
type = "gz.msgs.Pose_V"
dir = "in"
source = "custom"
rate_hz = 250
desc = """Pose of every robot link in world coordinates. This is the physics' \
TRUTH, not an estimate. It goes to NT so the app can draw it over the robot's \
odometry and make the error visible."""

[[gz]]
topic = "/world/mars/model/robot/link/chassis/sensor/imu/imu"
type = "gz.msgs.IMU"
dir = "in"
source = "gz-standard"
rate_hz = 200
desc = """Gyro. gz-sim-imu-system publishes it, and it does NOT need rendering \
(unlike cameras and lidar). It is remapped into the /mars space so the \
bridge does not depend on the model's link names."""

[[gz]]
topic = "/world/mars/clock"
type = "gz.msgs.Clock"
dir = "in"
source = "gz-standard"
rate_hz = 50
desc = """Simulation time. The bridge compares it with the wall clock to \
compute the real-time factor, which is the loop's health metric: if it \
stays below 1.0, the simulation stopped being valid."""

# ---------------------------------------------------------------------------
# Hop 3: bridge -> app, over NT4
# ---------------------------------------------------------------------------
# The NT4 server is NOT ours: the robot code brings it up on :5810. The bridge
# and the app are both clients. That is why everything below is "out": the
# bridge publishes to the robot's server, and the app reads from there.

[[nt]]
topic = "/MARS/Sim/truthPose"
type = "struct:Pose2d"
dir = "out"
desc = """The true pose according to the physics. The name says `truth` on \
purpose: it is not an estimate and must not feed any of the robot's control \
loops, or the simulation stops testing the odometry."""

[[nt]]
topic = "/MARS/Sim/truthPose3d"
type = "struct:Pose3d"
dir = "out"
desc = "The same but with height and full orientation, for the Field 3D."

[[nt]]
topic = "/MARS/Sim/simTime"
type = "double"
dir = "out"
desc = "Seconds of simulation elapsed."

[[nt]]
topic = "/MARS/Sim/realTimeFactor"
type = "double"
dir = "out"
desc = """How much simulation time advances per second of wall clock. \
1.0 is healthy. Sustained below ~0.95 the control loop is no longer \
representative and the app should warn about it."""

[[nt]]
topic = "/MARS/Sim/state"
type = "string"
dir = "out"
desc = "running | paused | resetting | error"

[[nt]]
topic = "/SmartDashboard/Field/Robot"
type = "double[]"
dir = "out"
desc = """{x, y, degrees}. Redundant with truthPose, but it is WPILib's \
Field2d convention and makes the sim show up in Glass, Shuffleboard and \
AdvantageScope without configuring anything."""

# ---------------------------------------------------------------------------
# Hop 2b: "vendor" profile — the robot code's glue, over NT4
# ---------------------------------------------------------------------------
# Only applies when profile = "vendor" in the robot-map (CAN motors, which
# wpilibws does not cover). The names carry `<name>`, which is the `name` of
# the actuator or encoder in the robot-map: they are not fixed topics but a
# template. Here the directions are inverted relative to the rest of the file,
# because it is the robot code that produces the outputs.

[[glue]]
topic = "/MARS/Glue/out/enabled"
type = "boolean"
dir = "in"
desc = """Whether the Driver Station has the robot enabled. The bridge translates it to /mars/cmd/match, and without it the engine keeps zero torque: a disabled robot rolls free. It is a fixed topic, not a template."""

[[glue]]
topic = "/MARS/Glue/out/<name>/setpoint"
type = "double"
dir = "in"
desc = """Position setpoint in MOTOR radians, for the actuators in `position`
mode. It is on the motor's axis and not the joint's for symmetry with
/MARS/Glue/in/<name>/position, which is what the robot code reads: both ends
of the loop speak the same units and the glue does not have to convert
anything. The bridge divides by the reduction before handing it to the engine.

An actuator in `duty` mode ignores this topic, and one in `position` mode
ignores /duty."""

[[glue]]
topic = "/MARS/Glue/out/<name>/duty"
type = "double"
dir = "in"
desc = """Duty cycle -1..1 the robot code asks of the motor. The glue \
publishes it by reading the vendor's sim API (TalonFXSimState.getMotorVoltage \
divided by the bus voltage, or SparkSim.getAppliedOutput)."""

[[glue]]
topic = "/MARS/Glue/in/<name>/position"
type = "double"
dir = "out"
desc = """Joint position in radians, on the MOTOR's axis (already multiplied \
by gearRatio). The glue feeds it to the vendor with setRawRotorPosition or \
equivalent."""

[[glue]]
topic = "/MARS/Glue/in/<name>/velocity"
type = "double"
dir = "out"
desc = "Joint velocity in rad/s, also on the motor's axis."

[[glue]]
topic = "/MARS/Glue/in/heartbeat"
type = "double"
dir = "out"
desc = """A counter that goes up every bridge cycle. It exists so the glue
can tell "the simulation sent a zero" from "the simulation is not there". A
stopped robot publishes zeros identical to those of a dead channel, and
without this the robot code would stay frozen waiting for data that never
changes.

A counter is used and not a timestamp because that way any read API works,
including the ones that only return the value."""


[[glue]]
topic = "/MARS/Glue/in/gyro/yaw"
type = "double"
dir = "out"
desc = """Yaw in degrees, CCW positive (WPILib's convention, NOT \
Gazebo's). The bridge does the conversion, not the glue, so the glue is as \
dumb as possible."""
