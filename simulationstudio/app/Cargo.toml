# MARS Simulation Studio: the simulation application, separate from mars-desktop.
#
# It does not share a workspace with the dashboard or with the bridge, on
# purpose. It is a different product, with its own life cycle: the simulation
# can be reinstalled or broken without touching the dashboard the team uses at
# competition.
#
# It carries no node toolchain. Its UI is a single-page static control panel
# in ui/, so it builds with cargo and nothing else. The dashboard with charts
# and a 3D field already exists --- it is mars-desktop, and it receives this
# simulation's data over NT4 exactly as from a real robot.
[package]
name = "mars-sim-app"
# Goes with MSS_VERSION in ui/js/constants.js: this one ends up in the
# executable and the installer; that one is what the interface shows.
version = "0.9.5"
edition = "2021"

# See the note in desktop/src-tauri/Cargo.toml: without `custom-protocol` the binary
# stays in development mode. It did not break here because this tauri.conf.json
# declares no devUrl, but relying on that coincidence is not a strategy.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
