<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MARS Simulation Studio</title>

<!--
  No framework and no bundler, on purpose (see app/README.md). What there is
  now is ES modules: the app went from four controls to a whole world editor,
  and keeping that in a single file was worse than the alternative. The
  browser resolves the imports on its own, so there is still no build step:
  `cargo build` and that is it.
-->
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <!--
    The loading screen lives in the HTML and not in a module on purpose: it is
    painted on the browser's first pass, before any script has been
    evaluated. The skeleton is here; js/splash.js fills in the steps as they
    really happen.

    It is also where a startup failure is shown, which is the one case where
    there is no other surface to write on.
  -->
  <div id="splash">
    <div class="splash-card">
      <div class="splash-head">
        <img src="mss.png" alt="" aria-hidden="true" />
        <div>
          <div class="splash-name">MARS Simulation Studio</div>
          <div class="splash-sub">Physics simulation and world authoring</div>
        </div>
      </div>

      <div class="splash-bar"><span id="splash-fill"></span></div>
      <div class="splash-line">
        <span id="splash-step">Starting…</span>
        <span id="splash-pct">0%</span>
      </div>

      <ol id="splash-steps"></ol>
      <div id="splash-error"></div>
    </div>

    <div class="splash-foot">
      <span>Powered by</span>
      <img src="icons/gazebo-logo.svg" alt="Gazebo" />
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
