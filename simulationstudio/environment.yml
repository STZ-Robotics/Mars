# Build and runtime environment of the simulation engine.
#
# Gazebo is NOT cloned into the repository: it is declared here and conda
# installs it as binaries in the environment's prefix. This file is to `sim/`
# what `package.json` is to the frontend and `Cargo.toml` to src-tauri.
#
#   conda env create -f sim/environment.yml
#   conda activate mars-sim
#
# CAREFUL with the names: in Jetty conda-forge stopped suffixing the version
# number onto the package. It is `gz-sim 10.*`, NOT `gz-sim10` (that scheme
# died in Ionic). Search with `conda search -c conda-forge gz-sim` and filter
# by version, because conda sorts versions as text and "10.5.0" shows up
# BEFORE "9.5.0" in the listing.
name: mars-sim

channels:
  - conda-forge

dependencies:
  # --- Gazebo Jetty core --------------------------------------------------
  # gz-sim pulls in gz-common, gz-math, gz-plugin, gz-utils and gz-fuel-tools
  # as dependencies. Only the ones our code uses directly are listed
  # separately, so a gz-sim update cannot change an API under us without us
  # noticing.
  - gz-sim 10.*          # ECS + simulation server (Jetty)
  - gz-transport 15.*    # IPC bus: the bridge talks through it
  - gz-msgs 12.*         # the protobufs that travel over transport
  - gz-physics 9.*       # DART / Bullet-Featherstone / TPE
  - sdformat 16.*        # world and robot description

  # The `gz-jetty` metapackage is NOT installed: it would pull in gz-launch and
  # gz-tools, which we do not use (the process supervisor is Tauri and the
  # `gz` CLI is only useful during development).
  #
  # Careful: gz-gui, gz-rendering and gz-sensors CANNOT be avoided. gz-sim's
  # conda package declares them as hard dependencies, so OGRE2 enters the
  # environment whether we like it or not. The distinction is at RUN time: our
  # server does not load those plugins, and that is why it stays headless. If
  # one day the shipped environment's size has to be trimmed, gz-sim has to be
  # built from source with the gui/rendering/sensors components disabled.

  # --- Build chain --------------------------------------------------------
  # The C++ compiler is not declared here on purpose. On Windows the
  # conda-forge packages are built with MSVC, so the system's MSVC has to be
  # used (Visual Studio Build Tools with the C++ workload); adding
  # `cxx-compiler` fights it more than it helps.
  - cmake >=3.22
  - ninja
  - pkg-config
