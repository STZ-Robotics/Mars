# The simulation bridge: translates between gz-transport (the engine), HALSim
# WebSocket (the robot code) and NT4 (the app). See ../protocol/README.md.
#
# An independent crate on purpose, outside src-tauri's workspace: the bridge
# is built and shipped as a separate binary, and putting it in the app's
# workspace would make a Tauri `cargo build` drag in Gazebo's dependencies.
#
# Building it needs the `mars-sim` conda environment (for the gz-transport
# libs) and PKG_CONFIG_PATH pointing at its pkgconfig. See README.md.
[package]
name = "mars-sim-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
# FFI wrapper around the C++ gz-transport. Chosen over `gz-transport-rs` (a
# pure Rust implementation) because that crate's publish advertises
# tcp://0.0.0.0, which is not connectable, and the engine never receives the
# commands. The full story is in README.md.
#
# The FFI's cost turned out to be zero in practice: the engine forces shipping
# the conda environment anyway, so linking against its libs adds no new
# runtime dependency.
gz-transport = { version = "0.10", features = ["jetty"] }
gz-msgs = { version = "0.10", features = ["jetty"] }

crossbeam-channel = "0.5"   # the type of the channel subscribe_channel returns
anyhow = "1"

# NT4: websocket + MessagePack. The same versions src-tauri uses, so the day
# the client is unified there are no dependencies to reconcile.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
rmp-serde = "1.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
# To read sim/protocol/topics.toml and generate the protocol constants.
toml = "0.8"
