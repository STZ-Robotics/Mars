# Publishes a release with the executables for all three platforms.
# Fires when a `vX.Y.Z` tag is pushed, or by hand from the Actions tab.
#
# It exists because you CANNOT build for all three platforms from one of them:
# Tauri links against the system webview (WebView2 on Windows, WebKitGTK on
# Linux, WKWebView on macOS), so every executable has to be built on its own
# operating system. Hence one job per platform on its own runner, with
# `manifest.json` assembled at the end, once every archive exists.

name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the v). Empty = the one in desktop/src/constants/version.ts"
        required: false

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing has no business taking the others down: a release
      # with two out of three is useful, and the installer says what is missing.
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-latest
          # 22.04 rather than the latest: it pins an older glibc, and a binary
          # linked against a newer one will not run on older distros, whereas
          # the other way round works fine.
          - name: Linux x86_64
            runner: ubuntu-22.04
          # A single macOS runner produces BOTH architectures: the system SDK is
          # universal and Rust crosses between them with a `--target`. There used
          # to be a `macos-13` job for Intel, but that runner no longer exists:
          # the job sat queued forever and, since the publishing job depends on
          # ALL of the matrix, the release never came out.
          - name: macOS (arm64 + x86_64)
            runner: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # The dashboard's package.json lives in desktop/, not at the root:
          # without this the cache step looks for a lockfile that is not there
          # and fails before anything is built.
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            installer

      # Tauri on Linux links against WebKitGTK and libsoup. Without this the
      # build fails inside `pkg-config` with an error that never mentions Tauri.
      #
      # This is exactly Tauri v2's list of prerequisites, not one package more:
      # the old `libappindicator3-dev` and `libayatana-appindicator3-dev`
      # EXCLUDE each other, and asking for both makes apt abort the whole
      # install. That is what killed the first attempt.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm ci
        working-directory: desktop

      - name: Check the version is in sync
        run: node scripts/sync-version.mjs

      # The release is named after the tag, but the manifest and the archives
      # carry version.ts's number, and that is what installers compare against
      # the installed one. A tag that does not match publishes a release no
      # installer offers as an update.
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION=$(grep -oE 'MARS_VERSION = "[^"]+"' desktop/src/constants/version.ts | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::the tag is ${GITHUB_REF_NAME} but desktop/src/constants/version.ts says ${VERSION}"
            exit 1
          fi

      - run: npm test
        working-directory: desktop

      # On every runner because the code that matters most here differs per
      # system: on Windows a running MARS locks its own executable, and the
      # test that an update refuses to start then only exists on Windows.
      - name: Installer tests
        run: cargo test --manifest-path installer/Cargo.toml

      - name: Build and package
        run: node scripts/package-release.mjs

      # macOS' second architecture, crossed from the same machine. `--arch`
      # gives the archives the right names; the installer works out on its own
      # which one applies to it.
      - name: Also package macOS x86_64
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          node scripts/package-release.mjs --arch x86_64

      # The app bundle is assembled by hand (package-release.mjs), so this is
      # where a broken one is found, not on a team's Mac: each archive must hold
      # a bundle with a valid Info.plist, a signature that verifies and a binary
      # of its own architecture, and the native one must open and stay open.
      - name: Check the app bundles (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for arch in aarch64 x86_64; do
            expected=$([ "$arch" = aarch64 ] && echo arm64 || echo x86_64)
            for edition in full tools; do
              dir=$(mktemp -d)
              tar -xzf "release/mars-desktop-${edition}-macos-${arch}.tar.gz" -C "$dir"
              app="$dir/MARS Desktop.app"
              test -x "$app/Contents/MacOS/mars-desktop"
              plutil -lint "$app/Contents/Info.plist"
              codesign --verify --deep --strict "$app"
              got=$(lipo -archs "$app/Contents/MacOS/mars-desktop")
              if [ "$got" != "$expected" ]; then
                echo "::error::${edition} ${arch}: the binary is ${got}"; exit 1
              fi
              echo "ok: ${edition} ${arch}"
            done
          done
          dir=$(mktemp -d)
          tar -xzf release/mars-desktop-full-macos-aarch64.tar.gz -C "$dir"
          open "$dir/MARS Desktop.app"
          sleep 10
          if ! pgrep -f "MARS Desktop.app/Contents/MacOS/mars-desktop"; then
            echo "::error::MARS Desktop.app did not stay open"; exit 1
          fi
          pkill -f "MARS Desktop.app/Contents/MacOS/mars-desktop" || true

      - uses: actions/upload-artifact@v6
        with:
          name: archives-${{ matrix.runner }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    # A dispatch from a test branch must NOT publish. This job has no trigger of
    # its own: it runs whenever `package` finishes, including the manual runs
    # used to try a change out on a branch. And it does not publish a draft --
    # with `draft: false` and a `tag_name` that falls back to `v<version>`, a
    # run from a branch would CREATE that tag and the release, on that branch's
    # commit, and the installer serves the latest release the moment it exists.
    #
    # So: tags publish, `main` publishes when it is dispatched by hand (that is
    # what the `version` input is for), and any other branch stops at the
    # artifacts, which is all a test run needs.
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          path: downloads

      # Artifacts come down in one folder per job; the release wants them flat
      # and with a single VERSION.
      - name: Collect the archives
        run: |
          mkdir -p release
          find downloads -type f ! -name VERSION -exec cp -n {} release/ \;
          ls -la release

      - name: Write the manifest
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP 'MARS_VERSION\s*=\s*"\K[^"]+' desktop/src/constants/version.ts)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/make-manifest.mjs release "$VERSION"

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: MARS ${{ env.VERSION }}
          # The installer reads the latest NON-draft release: publishing as a
          # draft would leave it saying "there is no release" with no
          # explanation.
          draft: false
          # The installers ask for the repository's latest release, which is
          # shared with Ares': a MARS release always takes the mark.
          make_latest: true
          generate_release_notes: true
          files: release/*
          body: |
            ## Installing

            Download the installer for your system and run it. It fetches the rest.

            | System | File |
            |---|---|
            | **Windows** (recommended) | `MARS-Installer.exe` |
            | Linux | `MARS-Installer-linux-x86_64` |
            | macOS | `MARS-Installer-macos-aarch64` (Apple Silicon) or `-x86_64` (Intel) |

            **Updating:** download the installer from this release and run it.
            Close MARS first: from installer 1.0.1 on it checks that itself, but
            an older installer on Windows would fail halfway with MARS open.

            On Linux and macOS make it executable first: `chmod +x MARS-Installer-*`.

            The installer lets you choose between **Complete MARS** (the whole
            ecosystem) and **Tools only** (the NetworkTables dashboard, without
            the framework), and it also uninstalls.

            The `.zip` and `.tar.gz` files listed here are what the installer
            downloads: there is no need to fetch them by hand.
