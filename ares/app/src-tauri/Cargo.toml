[package]
name = "ares-app"
version = "0.1.0"
description = "Ares: trajectory planning for STZ Robotics"
edition.workspace = true
license.workspace = true

[lib]
name = "ares_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# See desktop/src-tauri/Cargo.toml: a plain `cargo build --release` needs it to
# embed the interface instead of loading it from the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ares-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
