[package]
name = "ares-app"
version = "0.1.0"
description = "Ares: trajectory planning for STZ Robotics"
edition.workspace = true
license.workspace = true

[lib]
name = "ares_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# See desktop/src-tauri/Cargo.toml: a plain `cargo build --release` needs it to
# embed the interface instead of loading it from the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ares-core = { path = "../../core" }
ares-planner = { path = "../../planner" }
ares-tune = { path = "../../tune" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# NetworkTables: MARS Desktop's NT4 client (included by path in nt.rs), for
# the Characterize tab to watch and start the routines on the robot.
tokio = { version = "1.36", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
rmp-serde = "1.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
