import groovy.json.JsonSlurper

// AresLib, the robot side of Ares, as a MARS Feature: the same layout as the
// Feature template (MarsFeature.json drives the coordinates and the version),
// living next to the planner so the file format and its reader change together.

plugins {
    id 'java-library'
    id 'maven-publish'
    id "edu.wpi.first.GradleRIO" version "2026.1.1"
}

def parsedJson = new JsonSlurper().parseText(file('MarsFeature.json').text)

group = parsedJson.groupId
version = parsedJson.version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = uri("https://Imcab.github.io/FORGEmini/maven/") }
    maven { url = uri("https://STZ-Robotics.github.io/Mars/maven/") }
    maven { url = uri("https://maven.ctr-electronics.com/release/") }
}

def toGradleRange(String constraint) {
    if (constraint.startsWith(">=")) return "[${constraint.substring(2).trim()},)"
    if (constraint.startsWith(">")) return "(${constraint.substring(1).trim()},)"
    if (constraint.startsWith("<=")) return "(,${constraint.substring(2).trim()}]"
    if (constraint.startsWith("<")) return "(,${constraint.substring(1).trim()})"
    return constraint.trim()
}

dependencies {
    implementation wpi.java.deps.wpilib()
    implementation "edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:${wpi.versions.wpilibVersion.get()}"

    implementation "com.stzteam.forgemini:ForgeMini:${toGradleRange(parsedJson.forgeMiniRequired)}"
    implementation "com.stzteam.mars:Mars:${toGradleRange(parsedJson.marsCoreRequired)}"

    // Only CtreSwerve touches Phoenix, and a robot that uses it already has the
    // Phoenix 6 vendordep: compiled against, never shipped.
    compileOnly 'com.ctre.phoenix6:wpiapi-java:26.1.1'

    // Desktop natives (HAL, ntcore), for the tests that run the commands on
    // the real scheduler.
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

wpi.java.configureTestTasks(test)

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = group
            artifactId = parsedJson.featureId
            version = version
        }
    }
    repositories {
        maven {
            name = 'LocalRepo'
            url = layout.projectDirectory.dir('maven')
        }
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

task generateFeatureConstants {
    def packagePath = parsedJson.groupId.replace('.', '/')
    def srcDir = file("$projectDir/src/main/java/${packagePath}/generated")
    outputs.dir srcDir
    doLast {
        srcDir.mkdirs()
        new File(srcDir, "FeatureConstants.java").text = """package ${parsedJson.groupId}.generated;

// AUTO-GENERATED FILE DO NOT EDIT
public final class FeatureConstants {
    public static final String FEATURE_VERSION = "${parsedJson.version}";
    public static final String FEATURE_NAME = "${parsedJson.featureId}";
}
"""
    }
}

compileJava.dependsOn generateFeatureConstants
