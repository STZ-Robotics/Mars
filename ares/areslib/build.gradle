import groovy.json.JsonSlurper

// AresLib, the robot side of Ares, as a MARS Feature: the same layout as the
// Feature template (MarsFeature.json drives the coordinates and the version),
// living next to the planner so the file format and its reader change together.

plugins {
    id 'java-library'
    id 'maven-publish'
    id "edu.wpi.first.GradleRIO" version "2026.1.1"
}

def parsedJson = new JsonSlurper().parseText(file('MarsFeature.json').text)

group = parsedJson.groupId
version = parsedJson.version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = uri("https://Imcab.github.io/FORGEmini/maven/") }
    maven { url = uri("https://STZ-Robotics.github.io/Mars/maven/") }
    maven { url = uri("https://maven.ctr-electronics.com/release/") }
}

def toGradleRange(String constraint) {
    if (constraint.startsWith(">=")) return "[${constraint.substring(2).trim()},)"
    if (constraint.startsWith(">")) return "(${constraint.substring(1).trim()},)"
    if (constraint.startsWith("<=")) return "(,${constraint.substring(2).trim()}]"
    if (constraint.startsWith("<")) return "(,${constraint.substring(1).trim()})"
    return constraint.trim()
}

dependencies {
    implementation wpi.java.deps.wpilib()
    implementation "edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:${wpi.versions.wpilibVersion.get()}"

    implementation "com.stzteam.forgemini:ForgeMini:${toGradleRange(parsedJson.forgeMiniRequired)}"
    implementation "com.stzteam.mars:Mars:${toGradleRange(parsedJson.marsCoreRequired)}"

    // Only CtreSwerve touches Phoenix, and a robot that uses it already has the
    // Phoenix 6 vendordep: compiled against, never shipped.
    compileOnly 'com.ctre.phoenix6:wpiapi-java:26.1.1'

    // Desktop natives (HAL, ntcore), for the tests that run the commands on
    // the real scheduler.
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)

    // The end-to-end test drives a simulated CTRE swerve: Phoenix 6 from
    // vendordeps/, for the tests only.
    testImplementation wpi.java.vendor.java()
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform { excludeTags 'e2e' }
}

wpi.java.configureTestTasks(test)

// End to end: the planner (the real `ares plan`, Rust) plans a path for a robot, and AresLib follows
// it on a simulated CTRE swerve built from the same .robot.json. Not in `test`: it builds the
// planner (Sleipnir, by CMake) the first time and runs in real time. `./gradlew e2eTest`.
def e2eDir = layout.buildDirectory.dir('e2e').get().asFile
// The team's robot from examples/, planned at 85% of the motor's free speed (as the app suggests):
// at 100% no feedback can catch up, and Ares says so.
def e2eRobot = file('src/test/resources/e2e/offseason2026.robot.json')
def e2ePath = file('../examples/paths/hub-run.json')

task planE2E(type: Exec) {
    description = 'Plans the end-to-end test path with the real planner (ares plan).'
    inputs.files(e2eRobot, e2ePath, fileTree('../core/src'), fileTree('../planner/src'))
    outputs.file(new File(e2eDir, 'hub-run.traj.json'))
    workingDir = file('..')
    doFirst { e2eDir.mkdirs() }
    commandLine 'cargo', 'run', '--release', '--quiet', '--bin', 'ares', '--',
        'plan', e2eRobot.absolutePath, e2ePath.absolutePath, '-o', new File(e2eDir, 'hub-run.traj.json').absolutePath
}

task e2eTest(type: Test) {
    description = 'Plans with ares plan and follows on a simulated CTRE swerve.'
    group = 'verification'
    dependsOn planE2E
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'e2e' }
    systemProperty 'ares.e2e.dir', e2eDir.absolutePath
    systemProperty 'ares.e2e.robot', e2eRobot.absolutePath
    if (project.hasProperty('trace')) systemProperty 'ares.e2e.trace', 'true'
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}

wpi.java.configureTestTasks(e2eTest)

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = group
            artifactId = parsedJson.featureId
            version = version
        }
    }
    repositories {
        maven {
            name = 'LocalRepo'
            url = layout.projectDirectory.dir('maven')
        }
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

task generateFeatureConstants {
    def packagePath = parsedJson.groupId.replace('.', '/')
    def srcDir = file("$projectDir/src/main/java/${packagePath}/generated")
    outputs.dir srcDir
    doLast {
        srcDir.mkdirs()
        new File(srcDir, "FeatureConstants.java").text = """package ${parsedJson.groupId}.generated;

// AUTO-GENERATED FILE DO NOT EDIT
public final class FeatureConstants {
    public static final String FEATURE_VERSION = "${parsedJson.version}";
    public static final String FEATURE_NAME = "${parsedJson.featureId}";
}
"""
    }
}

compileJava.dependsOn generateFeatureConstants
